# Builds the website (the Expo web version of the app) from `develop` and
# deploys it to https://dev.belaybuddy.app on Spaceship.
#
# Unlike hcri.io, the server can't just `git pull`: the site has to be built
# first, and this repo is private. So the build runs here, the result is
# uploaded over SSH as one archive, and then synced into the site folder.
#
# Repository secrets (Settings > Secrets and variables > Actions). The first
# five are the same values as in the hcri.io repo (same server and account):
#   SPACESHIP_HOST, SPACESHIP_PORT, SPACESHIP_USER,
#   SPACESHIP_SSH_KEY, SPACESHIP_SSH_PASSPHRASE
#   SPACESHIP_DEV_PATH   absolute path of dev.belaybuddy.app's document root,
#                        e.g. /home/youruser/dev.belaybuddy.app
name: Deploy website (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-web-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          HOST: ${{ secrets.SPACESHIP_HOST }}
          USER: ${{ secrets.SPACESHIP_USER }}
          KEY: ${{ secrets.SPACESHIP_SSH_KEY }}
          DEST: ${{ secrets.SPACESHIP_DEV_PATH }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing SPACESHIP_HOST"
          [ -n "$USER" ] || missing="$missing SPACESHIP_USER"
          [ -n "$KEY" ] || missing="$missing SPACESHIP_SSH_KEY"
          [ -n "$DEST" ] || missing="$missing SPACESHIP_DEV_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Uses the dev Supabase project from .env. --clear stops Metro reusing
      # cached EXPO_PUBLIC_* values.
      # "Continue with Google" shows only once the Google secrets exist (see
      # supabase-auth-providers.yml).
      - name: Build website
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then export EXPO_PUBLIC_GOOGLE_SIGNIN=1; fi
          CI=1 npx expo export --clear --platform web --output-dir dist

      # Lets iPhones open /friend/... links in the app (universal links).
      - name: App link file
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_TEAM_ID" ]; then
            printf '{"applinks":{"apps":[],"details":[{"appIDs":["%s.app.belaybuddy.ios"],"components":[{"/":"/friend/*"}]}]}}\n' "$APPLE_TEAM_ID" > dist/apple-app-site-association
          else
            echo "::warning::APPLE_TEAM_ID is not set, so friend links will open the website, not the app."
          fi

      - name: Dev-only server rules
        run: |
          cat >> dist/.htaccess <<'EOF'

          # dev.belaybuddy.app only: keep the dev site out of search results.
          <IfModule mod_headers.c>
              Header always set X-Robots-Tag "noindex, nofollow"
          </IfModule>
          EOF
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          echo "${GITHUB_SHA::7}" > dist/version.txt

      - name: Package
        run: tar -czf site.tar.gz -C dist .

      - name: Upload
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SPACESHIP_HOST }}
          port: ${{ secrets.SPACESHIP_PORT }}
          username: ${{ secrets.SPACESHIP_USER }}
          key: ${{ secrets.SPACESHIP_SSH_KEY }}
          passphrase: ${{ secrets.SPACESHIP_SSH_PASSPHRASE }}
          source: site.tar.gz
          target: belaybuddy-deploy/dev

      - name: Install on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SPACESHIP_HOST }}
          port: ${{ secrets.SPACESHIP_PORT }}
          username: ${{ secrets.SPACESHIP_USER }}
          key: ${{ secrets.SPACESHIP_SSH_KEY }}
          passphrase: ${{ secrets.SPACESHIP_SSH_PASSPHRASE }}
          script: |
            set -e
            DEST="${{ secrets.SPACESHIP_DEV_PATH }}"
            WORK="$HOME/belaybuddy-deploy/dev"
            [ -d "$DEST" ] || { echo "Site folder $DEST doesn't exist. Create dev.belaybuddy.app in cPanel first."; exit 1; }
            rm -rf "$WORK/site" && mkdir -p "$WORK/site"
            tar -xzf "$WORK/site.tar.gz" -C "$WORK/site"
            # Replace the site's files, keeping cPanel's own folders.
            if command -v rsync >/dev/null; then
              rsync -a --delete --exclude .well-known --exclude cgi-bin "$WORK/site/" "$DEST/"
            else
              find "$DEST" -mindepth 1 -maxdepth 1 ! -name .well-known ! -name cgi-bin -exec rm -rf {} +
              cp -a "$WORK/site/." "$DEST/"
            fi
            rm -rf "$WORK/site" "$WORK/site.tar.gz"
            echo "Deployed $(cat "$DEST/version.txt") to $DEST"
