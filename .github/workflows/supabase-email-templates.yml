# Pushes the auth email templates in supabase/templates/ to Supabase through
# the Management API, so they never have to be edited in the dashboard.
#   push to develop -> belaybuddy-dev
#   push to master  -> belaybuddy-prod
#
# Uses the same secrets as supabase-migrations.yml. SUPABASE_ACCESS_TOKEN must
# have write access to the projects' Auth settings.
# Note: Supabase only accepts template changes once custom SMTP is configured
# for the project.
name: Supabase email templates

on:
  push:
    branches: [develop, master]
    paths:
      - 'supabase/templates/**'
      - '.github/workflows/supabase-email-templates.yml'
  workflow_dispatch:

concurrency:
  group: supabase-email-templates-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  templates:
    if: github.ref_name == 'develop' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Picked in the shell below; see supabase-migrations.yml for why.
      DEV_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}
      PROD_PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
      TARGET: ${{ github.ref_name == 'master' && 'belaybuddy-prod' || 'belaybuddy-dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ "$TARGET" = belaybuddy-prod ]; then PROJECT_ID="$PROD_PROJECT_ID"; else PROJECT_ID="$DEV_PROJECT_ID"; fi
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          # Tokens pasted on a phone often pick up spaces or line breaks.
          token=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          if [ "$token" != "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Removed whitespace from SUPABASE_ACCESS_TOKEN; re-save the secret without it."
          fi
          case "$token" in
            sbp_*) ;;
            *) echo "::warning::SUPABASE_ACCESS_TOKEN doesn't start with sbp_ (starts with '${token:0:3}', length ${#token}). Is it an account access token?" ;;
          esac
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN or the project id secret for $TARGET"
            exit 1
          fi

      - name: Build request
        run: |
          jq -n \
            --arg cs "$(jq -r .confirmation supabase/templates/subjects.json)" \
            --rawfile cc supabase/templates/confirmation.html \
            --arg ms "$(jq -r .magic_link supabase/templates/subjects.json)" \
            --rawfile mc supabase/templates/magic_link.html \
            '{
              mailer_subjects_confirmation: $cs,
              mailer_templates_confirmation_content: $cc,
              mailer_subjects_magic_link: $ms,
              mailer_templates_magic_link_content: $mc
            }' > body.json
          jq 'with_entries(.value |= (.[0:60] + "…"))' body.json

      - name: Update templates on ${{ env.TARGET }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @body.json)
          if [ "$status" -ge 300 ]; then
            detail=$(jq -c '{message, error} | with_entries(select(.value != null))' response.json 2>/dev/null || head -c 300 response.json)
            echo "::error::Supabase returned HTTP $status: $detail"
            exit 1
          fi
          echo "Templates updated on $TARGET (HTTP $status)"
