# Applies new database migrations (supabase/migrations/*.sql) to Supabase.
#   push to develop -> belaybuddy-dev
#   push to master  -> belaybuddy-prod
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token from supabase.com/dashboard/account/tokens
#   DEV_PROJECT_ID          project ref of belaybuddy-dev (the xxxx in https://xxxx.supabase.co)
#   DEV_DB_PASSWORD         database password of belaybuddy-dev
#   PROD_PROJECT_ID         project ref of belaybuddy-prod
#   PROD_DB_PASSWORD        database password of belaybuddy-prod
name: Supabase migrations

on:
  push:
    branches: [develop, master]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

# Never run two migration jobs against the same database at once.
concurrency:
  group: supabase-migrations-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref_name == 'develop' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ github.ref_name == 'master' && secrets.PROD_DB_PASSWORD || secrets.DEV_DB_PASSWORD }}
      PROJECT_ID: ${{ github.ref_name == 'master' && secrets.PROD_PROJECT_ID || secrets.DEV_PROJECT_ID }}
      TARGET: ${{ github.ref_name == 'master' && 'belaybuddy-prod' || 'belaybuddy-dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$PROJECT_ID" ] || missing="$missing project id"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing db password"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets for $TARGET:$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link ${{ env.TARGET }}
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Apply migrations to ${{ env.TARGET }}
        run: supabase db push
