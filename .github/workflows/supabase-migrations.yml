# Applies new database migrations (supabase/migrations/*.sql) to Supabase.
#   push to develop -> fizzgig-apps-dev
#   push to master  -> fizzgig-apps-prod
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token from supabase.com/dashboard/account/tokens
#   DEV_PROJECT_ID          project ref of fizzgig-apps-dev (the xxxx in https://xxxx.supabase.co)
#   DEV_DB_PASSWORD         database password of fizzgig-apps-dev
#   PROD_PROJECT_ID         project ref of fizzgig-apps-prod
#   PROD_DB_PASSWORD        database password of fizzgig-apps-prod
name: Supabase migrations

on:
  push:
    branches: [develop, master]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

# Never run two migration jobs against the same database at once.
concurrency:
  group: supabase-migrations-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref_name == 'develop' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Both sets are passed in and one is picked in the shell below. (A GitHub
      # `a && b || c` expression would silently fall back to the dev secret on
      # master if a prod secret were ever missing.)
      DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
      DEV_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}
      PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      PROD_PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
      TARGET: ${{ github.ref_name == 'master' && 'fizzgig-apps-prod' || 'fizzgig-apps-dev' }}
      # Session pooler hosts (not secret). GitHub runners are IPv4-only and the
      # direct database host is IPv6-only, so migrations go through the pooler.
      # Copy from the project's Connect > Direct > Session pooler string.
      DEV_POOLER_HOST: aws-0-us-east-1.pooler.supabase.com
      PROD_POOLER_HOST: aws-0-us-east-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4

      - name: Pick ${{ env.TARGET }} settings
        run: |
          if [ "$TARGET" = fizzgig-apps-prod ]; then
            PROJECT_ID="$PROD_PROJECT_ID"; SUPABASE_DB_PASSWORD="$PROD_DB_PASSWORD"; POOLER_HOST="$PROD_POOLER_HOST"
          else
            PROJECT_ID="$DEV_PROJECT_ID"; SUPABASE_DB_PASSWORD="$DEV_DB_PASSWORD"; POOLER_HOST="$DEV_POOLER_HOST"
          fi
          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "SUPABASE_DB_PASSWORD<<__EOF__"
            echo "$SUPABASE_DB_PASSWORD"
            echo "__EOF__"
            echo "POOLER_HOST=$POOLER_HOST"
          } >> "$GITHUB_ENV"
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$PROJECT_ID" ] || missing="$missing project id"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing db password"
          [ -n "$POOLER_HOST" ] || missing="$missing pooler host (set PROD_POOLER_HOST/DEV_POOLER_HOST in this workflow)"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets for $TARGET:$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations to ${{ env.TARGET }}
        run: |
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')
          echo "::add-mask::$password"
          supabase db push --db-url "postgresql://postgres.$PROJECT_ID:$password@$POOLER_HOST:5432/postgres"
