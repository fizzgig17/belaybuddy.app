# Trial: builds the iOS app on Expo's servers (EAS Build) and sends it to TestFlight.
# Runs when a push to develop has [eas] in its commit message, or by hand once this file
# is on the default branch (Actions > "iOS build with EAS (trial)" > Run workflow). It never
# runs on master, so it can't compete with ios-testflight.yml. The build itself runs on Expo's Macs, so this job
# uses a cheap Linux runner instead of GitHub macOS minutes.
#   branch master  -> production profile (prod Supabase)
#   other branches -> development-testflight profile (dev Supabase)
# Needs the repository secret EXPO_TOKEN. Signing is kept by EAS (set up once with
# `npx eas-cli credentials`).
name: iOS build with EAS (trial)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ios-eas
  cancel-in-progress: false

jobs:
  eas:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[eas]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ github.ref_name == 'master' && 'production' || 'development-testflight' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Add the repository secret EXPO_TOKEN (expo.dev > Account settings > Access tokens)."; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build on EAS and submit to TestFlight
        run: |
          echo "Profile: $PROFILE"
          set +e
          npx eas-cli@latest build --platform ios --profile "$PROFILE" --non-interactive --wait --auto-submit 2>&1 | tee eas.log
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            # The raw log is hard to open from a phone, so put the end of it in the error line.
            msg=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' eas.log | grep -v '^\s*$' | tail -n 14 | tr '\n' '|' | head -c 1500)
            echo "::error::EAS failed: ${msg//%/%25}"
            exit "$code"
          fi
