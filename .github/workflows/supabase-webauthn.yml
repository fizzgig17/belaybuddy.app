# Switches on Face ID / fingerprint (WebAuthn) as a second sign-in step for the
# owner dashboard, through the Supabase Management API.
#   push to develop -> belaybuddy-dev
#   push to master  -> belaybuddy-prod
# Uses the same secrets as supabase-auth-providers.yml. If Supabase rejects a
# field name the run prints its answer and fails, so nothing fails silently.
name: Supabase Face ID (WebAuthn)

on:
  push:
    branches: [develop, master]
    paths:
      - '.github/workflows/supabase-webauthn.yml'
  workflow_dispatch:

concurrency:
  group: supabase-webauthn-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  webauthn:
    if: github.ref_name == 'develop' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEV_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}
      PROD_PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
      TARGET: ${{ github.ref_name == 'master' && 'belaybuddy-prod' || 'belaybuddy-dev' }}
    steps:
      - name: Turn on WebAuthn
        run: |
          if [ "$TARGET" = belaybuddy-prod ]; then PROJECT_ID="$PROD_PROJECT_ID"; else PROJECT_ID="$DEV_PROJECT_ID"; fi
          token=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$token"
          if [ -z "$token" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN or the project id secret for $TARGET"
            exit 1
          fi
          body='{"mfa_web_authn_enroll_enabled":true,"mfa_web_authn_verify_enabled":true,"webauthn_rp_display_name":"Belay Buddy dashboard","webauthn_rp_id":"dashboard.belaybuddy.app","webauthn_rp_origins":"https://dashboard.belaybuddy.app"}'
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d "$body")
          echo "HTTP $code"
          if [ "$code" -ge 300 ]; then
            reply=$(head -c 400 resp.json | tr '\n' ' ')
            curl -sS "https://api.supabase.com/v1/projects/$PROJECT_ID/config/auth" -H "Authorization: Bearer $token" -o cur.json || true
            keys=$(python3 -c "import json;d=json.load(open('cur.json'));print(', '.join(f'{k}={d[k]}' for k in sorted(d) if any(w in k.lower() for w in ('webauthn','passkey','mfa'))))" 2>&1 | head -c 700)
            echo "::error::HTTP $code from Supabase: $reply || current fields: $keys"
            exit 1
          fi
          echo "Face ID (WebAuthn) is on for $TARGET"
