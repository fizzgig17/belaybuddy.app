# Fills the shop catalog for ~55 popular climbing metros from OpenStreetMap.
# Run it by hand (Actions > Seed shops > Run workflow, once this file is on the
# default branch) and pick dev or prod, or push a commit to develop whose message
# contains [shops] (all areas), [shops-test] (first 3) or [shops:boone,asheville]
# (only areas whose name contains one of those words). It is safe to run again
# any time (it updates shops and removes ones that are gone).
# Overpass blocks many cloud IPs, so this runs on a CI runner, not in Supabase.
name: Seed shops

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      target:
        description: Which database
        type: choice
        options: [dev, prod]
        default: dev
      limit:
        description: Only the first N areas (blank = all)
        required: false

concurrency:
  group: seed-gyms  # shares the gym seeding queue so Overpass isn't hit twice at once
  cancel-in-progress: false

jobs:
  seed:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shops')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET: ${{ inputs.target || 'dev' }}
      DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
      DEV_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}
      PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      PROD_PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
      POOLER_HOST: aws-0-us-east-1.pooler.supabase.com
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      SEED_ONLY: ${{ inputs.limit || (contains(github.event.head_commit.message, '[shops-test]') && '3') || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch shops from OpenStreetMap
        run: |
          # "[shops:boone,asheville]" in the commit message seeds only those areas.
          if [[ "$COMMIT_MSG" =~ \[shops:([^]]+)\] ]]; then export SEED_FILTER="${BASH_REMATCH[1]}"; echo "Only: $SEED_FILTER"; fi
          node .github/scripts/seed-shops.mjs "$RUNNER_TEMP/seed.sql" | tee "$RUNNER_TEMP/seed.log"
          echo "::notice::$(grep -E '^(SUMMARY|FAILED_LIST)' "$RUNNER_TEMP/seed.log" | tr '\n' ' ')"

      - name: Save them to the database
        run: |
          if [ "$TARGET" = prod ]; then PROJECT_ID="$PROD_PROJECT_ID"; DB_PASSWORD="$PROD_DB_PASSWORD"; else PROJECT_ID="$DEV_PROJECT_ID"; DB_PASSWORD="$DEV_DB_PASSWORD"; fi
          password=$(jq -rn --arg p "$DB_PASSWORD" '$p | @uri')
          echo "::add-mask::$password"
          psql "postgresql://postgres.$PROJECT_ID:$password@$POOLER_HOST:5432/postgres" -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/seed.sql"
          out=$(psql "postgresql://postgres.$PROJECT_ID:$password@$POOLER_HOST:5432/postgres" -At -c "select (select count(*) from public.shops) || ' shops (' || (select count(*) from public.shops where climbing) || ' climbing)'")
          echo "::notice::Catalog now: $out"
